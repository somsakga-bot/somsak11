const DICT=[
{wrong:"นะค่ะ",correct:"นะคะ",reason:"“นะค่ะ” ใช้ผิดเสมอ ใช้ “นะคะ” สำหรับประโยคบอกเล่า"},
{wrong:"สังเกตุ",correct:"สังเกต",reason:"สะกดที่ถูกต้องคือ “สังเกต”"},
{wrong:"อนุญาติ",correct:"อนุญาต",reason:"สะกดที่ถูกต้องคือ “อนุญาต”"},
{wrong:"ปรากฎ",correct:"ปรากฏ",reason:"สะกดที่ถูกต้องคือ “ปรากฏ”"},
{wrong:"ปรากฎการณ์",correct:"ปรากฏการณ์",reason:"สะกดที่ถูกต้องคือ “ปรากฏการณ์”"},
{wrong:"ป่าว",correct:"เปล่า",reason:"คำสุภาพที่ถูกต้องคือ “เปล่า”"},

{wrong:"เปน",correct:"เป็น",reason:"สะกดที่ถูกต้องคือ “เป็น”"},
{wrong:"เปนต้น",correct:"เป็นต้น",reason:"สะกดที่ถูกต้องคือ “เป็นต้น”"},
{wrong:"แลัว",correct:"แล้ว",reason:"สะกดที่ถูกต้องคือ “แล้ว”"},
{wrong:"เเล้ว",correct:"แล้ว",reason:"สะกดที่ถูกต้องคือ “แล้ว”"},
{wrong:"คอมพิวเตอ",correct:"คอมพิวเตอร์",reason:"คำทับศัพท์ที่ถูกต้องคือ “คอมพิวเตอร์”"},
{wrong:"อินเตอเน็ต",correct:"อินเตอร์เน็ต",reason:"คำทับศัพท์ที่ถูกต้องคือ “อินเตอร์เน็ต”"},
{wrong:"อินเทอเน็ต",correct:"อินเตอร์เน็ต",reason:"คำทับศัพท์ที่ถูกต้องคือ “อินเตอร์เน็ต”"},
{wrong:"ขอบคุน",correct:"ขอบคุณ",reason:"สะกดที่ถูกต้องคือ “ขอบคุณ”"},
{wrong:"ขอโทด",correct:"ขอโทษ",reason:"สะกดที่ถูกต้องคือ “ขอโทษ”"},
{wrong:"สวัสดีคับ",correct:"สวัสดีครับ",reason:"คำสุภาพที่ถูกต้องคือ “ครับ”"},
{wrong:"คับ",correct:"ครับ",reason:"คำสุภาพที่ถูกต้องคือ “ครับ”"},
{wrong:"กระเพรา",correct:"กะเพรา",reason:"สะกดที่ถูกต้องคือ “กะเพรา”"},
{wrong:"ลำคาญ",correct:"รำคาญ",reason:"สะกดที่ถูกต้องคือ “รำคาญ”"},

{wrong:"น่ารัค",correct:"น่ารัก",reason:"สะกดที่ถูกต้องคือ “น่ารัก”"},
{wrong:"อะร่อย",correct:"อร่อย",reason:"สะกดที่ถูกต้องคือ “อร่อย”"},
{wrong:"เพาะว่า",correct:"เพราะว่า",reason:"สะกดที่ถูกต้องคือ “เพราะว่า”"},

const SAMPLE1="สวัสดีคับ วันนี้สังเกตุเห็นว่ามีคนอนุญาติให้ใช้คอมพิวเตอ แต่ป่าวเลย ปรากฎว่าไห้ซักถามดูก่อนนะค่ะ  คุณจะไปไหมค่ะ  แล้ว แล้ว ผมจะรอ เป็นต้น ,ขอโทษที่มาช้า";
const SAMPLE2="เพาะว่าคอมพิวเตออินเตอเน็ตมีปัญหา ผมเลยขอโทดนะค่ะ  สังเกตุแล้ว ปรากฎว่าต้องรอตลอด";

function overlaps(s,e,list){return list.some(r=>s<r.end&&e>r.start)}

function findIssues(text){
  const out=[];
  const add=(s,e,t,sug,reason,kind)=>{
    if(s<0||e<=s||overlaps(s,e,out))return;
    out.push({id:`${s}-${e}-${t}`,start:s,end:e,text:t,suggestion:sug,reason,kind});
  };
  for(const d of DICT){
    let p=0;
    while(p<text.length){
      const i=text.indexOf(d.wrong,p);
      if(i===-1)break;
      add(i,i+d.wrong.length,d.wrong,d.correct,d.reason,"พจนานุกรม");
      p=i+d.wrong.length;
    }
  }
  const re=/ค่ะ|คะ/g;let m;
  while((m=re.exec(text))!==null){
    const i=m.index,w=m[0];
    if(overlaps(i,i+w.length,out))continue;
    const before=text.slice(0,i),after=text.slice(i+w.length);
    const st=Math.max(before.lastIndexOf("?"),before.lastIndexOf("."),before.lastIndexOf("!"),before.lastIndexOf("\n"))+1;
    const ends=[after.indexOf("?"),after.indexOf("."),after.indexOf("!"),after.indexOf("\n")].filter(x=>x>=0);
    const en=ends.length?i+w.length+Math.min(...ends):text.length;
    const sent=text.slice(st,en);
    const isQ=sent.includes("?")||/ไหม|หรือ|มั้ย|ใช่ไหม|หรือเปล่า|หรือยัง|ได้ไหม|หรือว่า/.test(sent);
    const afterNa=before.endsWith("นะ");
    if(w==="ค่ะ"&&isQ)add(i,i+2,w,"คะ","ประโยคคำถาม ใช้ “คะ” ไม่ใช้ “ค่ะ”","บริบทประโยค");
    if(w==="คะ"&&!isQ&&!afterNa)add(i,i+2,w,"ค่ะ","ประโยคบอกเล่า ใช้ “ค่ะ” ไม่ใช้ “คะ”","บริบทประโยค");
  }
  const dup=/(\S+)\s+\1/g;
  while((m=dup.exec(text))!==null)add(m.index,m.index+m[0].length,m[0],m[1],"คำซ้ำ ควรใช้เพียงครั้งเดียว","คำซ้ำ");
  const sp=/\s+([,.;!?])/g;
  while((m=sp.exec(text))!==null)add(m.index,m.index+m[0].length,m[0],m[1],"ไม่เว้นวรรคหน้าเครื่องหมายวรรคตอน","วรรคตอน");
  const ds=/[ ]{2,}/g;
  while((m=ds.exec(text))!==null)add(m.index,m.index+m[0].length,m[0]," ","เว้นวรรคเกิน ควรเว้นวรรคเพียงครั้งเดียว","ช่องว่าง");
  const cm=/,(?=[^\s])/g;
  while((m=cm.exec(text))!==null)add(m.index,m.index+1,",",", ","หลังจุลภาคควรเว้นวรรคหนึ่งครั้ง","วรรคตอน");
  return out.sort((a,b)=>a.start-b.start);
}

function applyAll(text,issues){
  let t=text;
  [...issues].sort((a,b)=>b.start-a.start).forEach(r=>{t=t.slice(0,r.start)+r.suggestion+t.slice(r.end)});
  return t;
}

async function api(action,args){
  const res=await fetch("actions",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,args})});
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j?.error)throw Error(j?.error||`ไม่สามารถเชื่อมต่อได้ (${res.status})`);
  return j.data;
}

function App(){
  const [text,setText]=useState("");
  const [activeId,setActiveId]=useState(null);
  const [msg,setMsg]=useState("");
  const [checked,setChecked]=useState(false);
  const [history,setHistory]=useState([]);
  const [histErr,setHistErr]=useState("");
  const [saving,setSaving]=useState(false);
  const [saveInfo,setSaveInfo]=useState(null);
  const outRef=useRef(null);

  const issues=useMemo(()=>checked?findIssues(text):[],[text,checked]);
  const words=useMemo(()=>text.trim()?text.trim().split(/\s+/).filter(Boolean).length:0,[text]);
  const wrong=issues.length;
  const accuracy=words===0?100:Math.max(0,Math.round((words-wrong)/words*100));
  const corrected=useMemo(()=>applyAll(text,issues),[text,issues]);
  const active=issues.find(i=>i.id===activeId)||null;

  const loadHistory=async()=>{
    const d=(await api("records.list",{collection:"checks",limit:20}))?.records||[];
    setHistory(d);setHistErr("");
  };
  const createRecord=async v=>{
    await api("records.create",{collection:"checks",value:v,idempotency_key:`check-${v.savedAt}-${v.total}-${v.wrong}`});
  };
  useEffect(()=>{loadHistory().catch(e=>setHistErr(e instanceof Error?e.message:String(e)))},[]);

  const runCheck=()=>{
    if(!text.trim()){setMsg("กรุณาใส่ข้อความก่อนตรวจ");return}
    setChecked(true);setActiveId(null);setMsg("");
    setTimeout(()=>setMsg("ตรวจเสร็จแล้ว แตะคำที่ไฮไลต์สีแดงเพื่อดูคำแนะนำ"),30);
  };
  const fixOne=i=>{
    if(!i)return;
    setText(t=>t.slice(0,i.start)+i.suggestion+t.slice(i.end));
    setActiveId(null);setMsg(`แก้ “${i.text}” เป็น “${i.suggestion}” แล้ว`);
  };
  const fixSame=i=>{
    if(!i)return;
    const same=issues.filter(x=>x.text===i.text);
    setText(t=>applyAll(t,same));
    setActiveId(null);setMsg(`แก้ “${i.text}” ทั้งหมด ${same.length} จุดแล้ว`);
  };
  const fixAll=()=>{
    if(!issues.length)return;
    setText(corrected);setActiveId(null);setMsg(`แก้ทั้งหมด ${issues.length} จุดแล้ว`);
  };
  const useSample=s=>{setText(s);setChecked(true);setActiveId(null);setMsg("ใส่ข้อความตัวอย่างแล้ว แตะคำที่ไฮไลต์เพื่อดูคำแนะนำ")};
  const clearAll=()=>{setText("");setChecked(false);setActiveId(null);setMsg("ล้างข้อความแล้ว");setSaveInfo(null)};
  const copyOut=()=>{
    const el=outRef.current;if(!el)return;
    el.focus();el.select();
    const ok=document.execCommand("copy");
    setMsg(ok?"คัดลอกข้อความที่แก้แล้วไว้แล้ว นำไปวางได้เลย":"เลือกข้อความในกล่องผลลัพธ์แล้วคัดลอกอีกครั้ง");
  };
  const saveCheck=async()=>{
    if(!text.trim()){setMsg("กรุณาใส่ข้อความก่อนบันทึก");return}
    const items=[{text,corrected,total:words,wrong,savedAt:new Date().toISOString()}];
    setSaving(true);
    let saved=0,err=null;
    try{for(const it of items){await createRecord(it);saved+=1}}catch(e){err=e instanceof Error?e.message:String(e)}
    let reloadErr=null;
    try{await loadHistory()}catch(e){reloadErr=e instanceof Error?e.message:String(e)}
    setSaveInfo({saved,remaining:items.length-saved,error:err,reloadError:reloadErr});
    setSaving(false);
    if(!err)setMsg("บันทึกผลตรวจนี้แล้ว");
  };
  const loadItem=r=>{
    setText(r.value.text);setChecked(true);setActiveId(null);setMsg("โหลดข้อความที่บันทึกไว้แล้ว");
    window.scrollTo({top:0,behavior:"smooth"});
  };
  const delItem=async id=>{
    try{await api("records.delete",{collection:"checks",id});await loadHistory();setMsg("ลบรายการที่บันทึกแล้ว")}
    catch(e){setMsg(e instanceof Error?e.message:String(e))}
  };

  const renderHighlighted=()=>{
    if(!text)return <span className="text-[var(--muted)]">ข้อความของคุณจะแสดงตรงนี้หลังพิมพ์หรือเลือกตัวอย่าง</span>;
    const parts=[];let pos=0;
    issues.forEach((r,idx)=>{
      if(r.start>pos)parts.push(<span key={`t-${idx}`}>{text.slice(pos,r.start)}</span>);
      parts.push(
        <button key={r.id} type="button" onClick={()=>setActiveId(r.id)}
          className={`word-btn rounded px-0.5 font-bold underline decoration-2 underline-offset-4 ${activeId===r.id?"bg-[var(--danger)] text-white":"bg-[var(--danger-soft)] text-[var(--danger)]"}`}
          aria-label={`คำผิด ${r.text} แนะนำ ${r.suggestion}`}>{r.text}</button>
      );
      pos=r.end;
    });
    if(pos<text.length)parts.push(<span key="tail">{text.slice(pos)}</span>);
    return <>{parts}</>;
  };

  return (
  <div className="min-h-[100dvh] overflow-x-clip bg-[var(--bg)] text-[var(--ink)]">
    <header className="sticky top-0 z-20 border-b border-[var(--line)] bg-[var(--surface)]/95 backdrop-blur">
      <div className="mx-auto flex max-w-5xl items-center gap-3 px-4 py-3">
        <div className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-[var(--primary)] text-white"><ScanLine size={26}/></div>
        <div className="min-w-0">
          <h1 className="thai-display text-[clamp(1.25rem,5vw,1.8rem)] font-extrabold leading-tight">สแกนตรวจคำผิดภาษาไทย</h1>
          <p className="text-xs text-[var(--muted)] sm:text-sm">พิมพ์หรือวางข้อความ แล้วตรวจ แก้ไข และคัดลอกได้ทันที</p>
        </div>
        <span className="ml-auto hidden rounded-full bg-[var(--success-soft)] px-3 py-1 text-xs font-bold text-[var(--success)] sm:block">ตรวจแบบออฟไลน์</span>
      </div>
    </header>

    <main className="mx-auto max-w-5xl px-4 pb-16 pt-4 sm:px-6">
      <section className="overflow-hidden rounded-[28px] bg-[var(--primary)] p-5 text-white sm:p-7">
        <p className="text-sm font-bold opacity-90">ใช้งานง่าย 4 ขั้นตอน</p>
        <h2 className="thai-display mt-2 text-[clamp(1.65rem,7vw,2.8rem)] font-extrabold leading-[1.15]">พิมพ์ข้อความ<br/>แล้วให้แอปช่วยจับคำผิด</h2>
        <p className="mt-3 max-w-2xl text-sm leading-relaxed opacity-90 sm:text-base">ตรวจคำที่พบบ่อย ค่ะ/คะ คำซ้ำ ช่องว่าง และวรรคตอน แล้วแตะคำที่ไฮไลต์เพื่อแก้ทีละคำหรือแก้ทั้งหมด</p>
        <div className="mt-5 grid grid-cols-2 gap-2 sm:grid-cols-4">
          {["1 ใส่ข้อความ","2 ตรวจคำผิด","3 แก้ไขคำผิด","4 คัดลอกผลลัพธ์"].map(s=>(
            <div key={s} className="rounded-2xl bg-white/15 px-3 py-3 text-center text-sm font-bold">{s}</div>))}
        </div>
        <div className="mt-4 flex items-start gap-2 rounded-2xl bg-black/15 p-3 text-xs leading-relaxed sm:text-sm">
          <CameraOff className="mt-0.5 shrink-0" size={18}/>
          <span>การถ่ายภาพจากกล้องและการเลือกไฟล์รูปภาพยังไม่พร้อมใช้งานในตอนนี้ ใช้การพิมพ์หรือวางข้อความด้านล่างแทนได้เลย</span>
        </div>
      </section>

      <section className="mt-4 grid gap-4 lg:grid-cols-[1.25fr_.75fr]">
        <div className="rounded-[24px] border border-[var(--line)] bg-[var(--surface)] p-4 sm:p-5">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <h2 className="flex items-center gap-2 text-lg font-extrabold"><FileText className="text-[var(--primary)]"/> ข้อความที่ต้องการตรวจ</h2>
            <span className="text-sm text-[var(--muted)]">{words} คำ</span>
          </div>
          <label className="mt-3 block text-sm font-bold text-[var(--muted)]" htmlFor="source-text">พิมพ์หรือวางข้อความภาษาไทยที่นี่</label>
          <textarea id="source-text" value={text} onChange={e=>{setText(e.target.value);setChecked(false);setActiveId(null)}}
            placeholder="เช่น วันนี้ผมสังเกตุเห็น..."
            className="mt-2 min-h-[180px] w-full resize-y rounded-2xl border border-[var(--line)] bg-[var(--bg)] p-4 text-[17px] leading-8 outline-none focus:border-[var(--primary)]"/>
          <div className="mt-3 flex flex-wrap gap-2">
            <button onClick={()=>useSample(SAMPLE1)} className="flex items-center gap-2 rounded-full bg-[var(--primary)] px-4 py-3 text-sm font-extrabold text-white"><Sparkles size={18}/> ลองข้อความตัวอย่าง</button>
            <button onClick={()=>useSample(SAMPLE2)} className="rounded-full border border-[var(--primary)] px-4 py-3 text-sm font-extrabold text-[var(--primary)]">ตัวอย่างที่ 2</button>
            <button onClick={runCheck} className="flex items-center gap-2 rounded-full bg-[var(--success)] px-4 py-3 text-sm font-extrabold text-white"><BookCheck size={18}/> ตรวจคำผิด</button>
            <button onClick={clearAll} className="flex items-center gap-2 rounded-full bg-[var(--surface-2)] px-4 py-3 text-sm font-extrabold"><Eraser size={18}/> ล้าง</button>
          </div>
          {msg&&<p role="status" className="mt-3 rounded-xl bg-[var(--surface-2)] px-3 py-2 text-sm font-bold">{msg}</p>}
        </div>

        <div className="rounded-[24px] border border-[var(--line)] bg-[var(--surface)] p-4 sm:p-5">
          <h2 className="text-lg font-extrabold">สรุปผลการตรวจ</h2>
          <div className="mt-4 grid grid-cols-3 gap-2 text-center">
            <div className="rounded-2xl bg-[var(--surface-2)] p-3"><div className="text-[clamp(1.4rem,6vw,2rem)] font-black leading-none">{words}</div><div className="mt-1 text-xs text-[var(--muted)]">คำทั้งหมด</div></div>
            <div className="rounded-2xl bg-[var(--danger-soft)] p-3"><div className="text-[clamp(1.4rem,6vw,2rem)] font-black leading-none text-[var(--danger)]">{wrong}</div><div className="mt-1 text-xs text-[var(--muted)]">จุดที่ควรแก้</div></div>
            <div className="rounded-2xl bg-[var(--success-soft)] p-3"><div className="text-[clamp(1.4rem,6vw,2rem)] font-black leading-none text-[var(--success)]">{accuracy}%</div><div className="mt-1 text-xs text-[var(--muted)]">ความถูกต้อง</div></div>
          </div>
          <div className="mt-4 h-3 overflow-hidden rounded-full bg-[var(--surface-2)]"><div className="h-full rounded-full bg-[var(--success)] transition-all" style={{width:`${accuracy}%`}}/></div>
          <p className="mt-3 text-sm leading-relaxed text-[var(--muted)]">แตะคำสีแดงในข้อความด้านล่างเพื่อดูเหตุผลและคำที่แนะนำ แล้วเลือกแก้ทีละคำหรือแก้ทั้งหมด</p>
          <button onClick={fixAll} disabled={!issues.length} className="mt-4 flex w-full items-center justify-center gap-2 rounded-full bg-[var(--warning)] px-4 py-3 font-extrabold text-white"><WandSparkles size={18}/> แก้ทั้งหมด {issues.length?`(${issues.length} จุด)`:""}</button>
          <button onClick={saveCheck} disabled={saving||!text.trim()} className="mt-2 flex w-full items-center justify-center gap-2 rounded-full border border-[var(--primary)] px-4 py-3 font-extrabold text-[var(--primary)]"><Save size={18}/> {saving?"กำลังบันทึก...":"บันทึกผลตรวจนี้"}</button>
          {saveInfo&&<p role="status" className="mt-3 rounded-xl bg-[var(--surface-2)] px-3 py-2 text-sm">บันทึกแล้ว {saveInfo.saved} รายการ เหลือ {saveInfo.remaining} รายการ {saveInfo.error?`ข้อผิดพลาด: ${saveInfo.error}`:""} {saveInfo.reloadError?`โหลดใหม่ไม่สำเร็จ: ${saveInfo.reloadError}`:""}</p>}
        </div>
      </section>

      <section className="mt-4 rounded-[24px] border border-[var(--line)] bg-[var(--surface)] p-4 sm:p-5">
        <div className="flex items-center justify-between gap-3">
          <h2 className="text-lg font-extrabold">ข้อความพร้อมคำแนะนำ</h2>
          <span className="text-xs text-[var(--muted)]">แตะคำที่ไฮไลต์</span>
        </div>
        <div className="text-wrap-anywhere mt-3 min-h-[120px] rounded-2xl bg-[var(--bg)] p-4 text-[17px] leading-9">{renderHighlighted()}</div>
        {active?(
          <div className="mt-4 rounded-2xl border-2 border-[var(--danger)] bg-[var(--danger-soft)] p-4">
            <div className="flex items-start gap-2">
              <Lightbulb className="mt-0.5 shrink-0 text-[var(--warning)]"/>
              <div>
                <p className="font-extrabold">คำว่า “{active.text}”</p>
                <p className="mt-1 text-sm leading-relaxed">{active.reason}</p>
                <p className="mt-2 text-sm">แนะนำเป็น <strong className="text-[var(--success)]">“{active.suggestion}”</strong> <span className="text-[var(--muted)]">· {active.kind}</span></p>
              </div>
            </div>
            <div className="mt-3 flex flex-wrap gap-2">
              <button onClick={()=>fixOne(active)} className="rounded-full bg-[var(--primary)] px-4 py-2.5 text-sm font-extrabold text-white">แก้คำนี้</button>
              <button onClick={()=>fixSame(active)} className="rounded-full bg-white px-4 py-2.5 text-sm font-extrabold text-[var(--ink)]">แก้คำนี้ทั้งหมด</button>
              <button onClick={()=>setActiveId(null)} className="rounded-full px-3 py-2.5 text-sm font-bold text-[var(--muted)]">ปิดคำแนะนำ</button>
            </div>
          </div>
        ):checked&&issues.length>0?(
          <p className="mt-3 text-sm text-[var(--muted)]">เลือกคำที่ไฮไลต์สีแดงเพื่อดูคำแนะนำ</p>
        ):checked?(
          <p className="mt-3 flex items-center gap-2 text-sm font-bold text-[var(--success)]"><CircleCheck size={18}/> ไม่พบคำผิดจากกฎที่ตั้งไว้ ลองตรวจซ้ำหลังแก้ไขประโยค</p>
        ):null}
      </section>

      <section className="mt-4 overflow-hidden rounded-[24px] border border-[var(--line)] bg-[var(--surface)]">
        <div className="p-4 sm:p-5">
          <h2 className="text-lg font-extrabold">รายการคำผิดพร้อมคำที่แนะนำ</h2>
          <p className="text-sm text-[var(--muted)]">ตารางนี้อัปเดตตามข้อความด้านบน</p>
        </div>
        {issues.length?(
          <div className="overflow-x-auto">
            <table className="w-full min-w-[560px] border-t border-[var(--line)] text-left text-sm">
              <thead className="bg-[var(--surface-2)]"><tr><th className="px-4 py-3">คำที่พบ</th><th className="px-4 py-3">คำที่แนะนำ</th><th className="px-4 py-3">เหตุผล</th><th className="px-4 py-3">จัดการ</th></tr></thead>
              <tbody>
                {issues.map(r=>(
                  <tr key={r.id} className="border-t border-[var(--line)]">
                    <td className="px-4 py-3 font-bold text-[var(--danger)]">{r.text}</td>
                    <td className="px-4 py-3 font-bold text-[var(--success)]">{r.suggestion}</td>
                    <td className="px-4 py-3 leading-relaxed">{r.reason}</td>
                    <td className="px-4 py-3"><button onClick={()=>fixOne(r)} className="rounded-full bg-[var(--primary)] px-3 py-2 text-xs font-extrabold text-white">แก้คำนี้</button></td>
                  </tr>))}
              </tbody>
            </table>
          </div>
        ):<p className="border-t border-[var(--line)] px-5 py-6 text-sm text-[var(--muted)]">ยังไม่มีรายการคำผิด ใส่ข้อความแล้วกด “ตรวจคำผิด”</p>}
      </section>

      <section className="mt-4 rounded-[24px] border border-[var(--line)] bg-[var(--surface)] p-4 sm:p-5">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <h2 className="flex items-center gap-2 text-lg font-extrabold"><ClipboardCheck className="text-[var(--primary)]"/> ข้อความที่แก้แล้ว</h2>
          <button onClick={copyOut} disabled={!text} className="flex items-center gap-2 rounded-full bg-[var(--primary)] px-4 py-2.5 text-sm font-extrabold text-white"><Copy size={17}/> คัดลอกข้อความที่แก้แล้ว</button>
        </div>
        <textarea ref={outRef} readOnly value={corrected} aria-label="ข้อความที่แก้แล้ว" className="text-wrap-anywhere mt-3 min-h-[150px] w-full resize-y rounded-2xl border border-[var(--line)] bg-[var(--bg)] p-4 text-[17px] leading-8"/>
        <div className="mt-3 flex flex-wrap gap-2">
          <button onClick={fixAll} disabled={!issues.length} className="rounded-full bg-[var(--warning)] px-4 py-3 text-sm font-extrabold text-white">แก้ทั้งหมด</button>
          <button onClick={clearAll} className="rounded-full bg-[var(--surface-2)] px-4 py-3 text-sm font-extrabold">ล้างข้อความ</button>
          <button onClick={()=>useSample(SAMPLE1)} className="rounded-full bg-[var(--surface-2)] px-4 py-3 text-sm font-extrabold">สแกนใหม่ด้วยตัวอย่าง</button>
        </div>
      </section>

      <section className="mt-4 rounded-[24px] border border-[var(--line)] bg-[var(--surface)] p-4 sm:p-5">
        <h2 className="flex items-center gap-2 text-lg font-extrabold"><History className="text-[var(--primary)]"/> ประวัติที่บันทึกไว้</h2>
        {histErr&&<p className="mt-2 text-sm text-[var(--danger)]">โหลดประวัติไม่ได้: {histErr}</p>}
        {!histErr&&history.length===0&&<p className="mt-2 text-sm text-[var(--muted)]">ยังไม่มีประวัติที่บันทึกไว้ กด “บันทึกผลตรวจนี้” เพื่อเก็บข้อความไว้เปิดดูภายหลัง</p>}
        <div className="mt-3 grid gap-3">
          {history.map(r=>(
            <article key={r.id} className="rounded-2xl border border-[var(--line)] p-4">
              <p className="text-wrap-anywhere line-clamp-2 text-sm leading-relaxed">{r.value.text}</p>
              <p className="mt-2 text-xs text-[var(--muted)]">คำทั้งหมด {r.value.total} · ควรแก้ {r.value.wrong} จุด · บันทึกเมื่อ {new Date(r.value.savedAt).toLocaleString("th-TH")}</p>
              <div className="mt-3 flex flex-wrap gap-2">
                <button onClick={()=>loadItem(r)} className="rounded-full bg-[var(--primary)] px-3 py-2 text-xs font-extrabold text-white">โหลดข้อความนี้</button>
                <button onClick={()=>delItem(r.id)} className="flex items-center gap-1 rounded-full bg-[var(--danger-soft)] px-3 py-2 text-xs font-extrabold text-[var(--danger)]"><Trash2 size={14}/> ลบ</button>
              </div>
            </article>))}
        </div>
      </section>
    </main>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<React.StrictMode><App/></React.StrictMode>);
</script>
</body>
</html>
